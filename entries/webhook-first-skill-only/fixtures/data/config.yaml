platforms:
  webhook:
    enabled: true
    extra:
      routes:
        both-listed:
          secret: casebook-placeholder-secret
          signature: generic
          skills:
            - casebook-alpha
            - casebook-beta
          prompt: "Reply with one word. Marker ROUTE-BOTH."
        first-missing:
          secret: casebook-placeholder-secret
          signature: generic
          skills:
            - casebook-missing
            - casebook-beta
          prompt: "Reply with one word. Marker ROUTE-MISSING."
