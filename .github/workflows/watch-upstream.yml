name: watch-upstream

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      tag:
        description: Hermes tag to check; empty checks the latest stable release
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: watch-upstream
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run every entry against the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            python harness/watch.py --tag "$INPUT_TAG" --open-issue
          else
            python harness/watch.py --open-issue
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: watch-results
          path: |
            results
            watch-report.md
          if-no-files-found: ignore
